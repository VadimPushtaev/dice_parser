[tool.poetry]
name = "dice-parser"
version = "1.0.0"
description = "Arithmetic expressions with dice roll support"
authors = ["Vadim Pushtaev <pushtaev.vm@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/VadimPushtaev/dice_parser"
repository = "https://github.com/VadimPushtaev/dice_parser"
packages = [{ include = "dice_parser" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
lark = ">=1.1.9"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.9"
pre-commit = ">=4.0"
pytest = ">=8.0"
ruff = ">=0.14"

[tool.ruff]
line-length = 88
target-version = "py312"
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001", # missing-copyright-notice: project does not require file headers
    "DOC201", # return-not-documented: terse docstrings are enough here
    "PLR6301", # no-self-use: instance methods may keep self for consistency
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # assert: pytest uses plain asserts for test expectations
    "SLF001", # private-member-access: tests may exercise internals directly
    "PLR2004", # magic-value-comparison: test data is clearer inline
]

[tool.mypy]
files = ["dice_parser", "tests"]
python_version = "3.12"
strict = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_unimported = true
extra_checks = true
local_partial_types = true
strict_bytes = true
warn_unreachable = true
warn_unused_configs = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
